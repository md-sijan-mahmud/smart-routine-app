<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Routine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 flex items-center justify-center min-h-screen px-4">
    
    <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-sm w-full max-w-md">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 mb-3 border border-emerald-500/20">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900 dark:text-white">Create New Account</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Sign up to get your personal routine dashboard</p>
        </div>

        <!-- Register Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-xs text-red-500 mt-1">{{ field.errors.0 }}</p>
                {% endif %}
                {% if field.help_text %}
                    <p class="text-[10px] text-slate-400 mt-1">{{ field.help_text|safe }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition-all cursor-pointer text-sm shadow-sm">
                Register
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center mt-6">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-emerald-600 dark:text-emerald-400 font-semibold hover:underline">Login here</a>
            </p>
        </div>

    </div>

</body>
</html>
