<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - Smart Routine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-md rounded-3xl border border-slate-800 p-6 shadow-2xl">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
            <h3 class="font-bold text-base flex items-center space-x-2">
                <i class="fa-regular fa-user text-emerald-500"></i>
                <span>Edit Your Profile</span>
            </h3>
            <a href="{% url 'dashboard' %}" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></a>
        </div>
        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Username</label>
                <input type="text" name="username" value="{{ request.user.username }}" class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" value="{{ request.user.email }}" class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500">
            </div>
            <div class="flex justify-end space-x-2 pt-4">
                <a href="{% url 'dashboard' %}" class="px-4 py-2.5 bg-slate-800 text-slate-300 font-semibold rounded-xl">Cancel</a>
                <button type="submit" class="px-5 py-2.5 bg-emerald-500 text-slate-950 font-semibold rounded-xl">Save Changes</button>
            </div>
        </form>
    </div>
</body>
</html>
