<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activity & Stats - Smart Routine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 w-full max-w-md rounded-3xl border border-slate-800 p-6 shadow-2xl">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
            <h3 class="font-bold text-base flex items-center space-x-2">
                <i class="fa-regular fa-chart-bar text-sky-500"></i>
                <span>Activity & Stats</span>
            </h3>
            <a href="{% url 'dashboard' %}" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></a>
        </div>
        <div class="space-y-3 text-xs">
            <div class="flex justify-between p-3 rounded-xl bg-slate-800/50 border border-slate-800">
                <span class="text-slate-400 font-medium">Signed in User:</span>
                <span class="font-bold text-white">@{{ request.user.username }}</span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-slate-800/50 border border-slate-800">
                <span class="text-slate-400 font-medium">Current Streak:</span>
                <span class="font-bold text-amber-500">🔥 5 Days</span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-slate-800/50 border border-slate-800">
                <span class="text-slate-400 font-medium">Telegram Bot Status:</span>
                <span class="font-bold text-sky-500">Active (@sijan_routine_bot)</span>
            </div>
        </div>
        <div class="mt-6 flex justify-end">
            <a href="{% url 'dashboard' %}" class="px-5 py-2.5 bg-emerald-500 text-slate-950 font-semibold rounded-xl text-xs">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
